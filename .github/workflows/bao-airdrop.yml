name: Bao Airdrop

on:
  # 手动触发：填写置顶推文 ID 和每人空投数量；勾选"确认空投发放"才会真正转账
  workflow_dispatch:
    inputs:
      pinned_tweet_id:
        description: "X 置顶推文 ID（x.com/Chinaabao/status/<ID>）"
        required: true
        type: string
      airdrop_amount:
        description: "每人空投 $BAO 数量"
        required: true
        type: number
      confirm_payout:
        description: "确认空投发放（勾选后才会自动转账；不勾选仅收集名单+公告）"
        required: false
        default: false
        type: boolean

jobs:
  airdrop:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 用于把已空投地址历史提交回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install solana solders

      - name: Run airdrop (collect addresses & publish)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PINNED_TWEET_ID: ${{ github.event.inputs.pinned_tweet_id }}
          AIRDROP_AMOUNT: ${{ github.event.inputs.airdrop_amount }}
          AIRDROP_TOKEN_MINT: ${{ secrets.AIRDROP_TOKEN_MINT }}
          AIRDROP_WALLET_PRIVKEY: ${{ secrets.AIRDROP_WALLET_PRIVKEY }}
          CONFIRM_PAYOUT: ${{ github.event.inputs.confirm_payout }}
          AIRDROP_HISTORY_FILE: airdrop_history.json
          BAO_TG_BOT_TOKEN: ${{ secrets.BAO_TG_BOT_TOKEN }}
          BAO_TG_CHAT_ID: ${{ secrets.BAO_TG_CHAT_ID }}
        run: python3 lottery/scripts/bao_airdrop.py

      - name: Commit airdrop history
        # 仅在确认发放后才把已空投地址历史提交回仓库，供下次去重
        if: github.event.inputs.confirm_payout == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Chinaabao"
          git config user.email "Chinaabao@users.noreply.github.com"
          git add airdrop_history.json
          git diff --cached --quiet || git commit -m "Update airdrop history (airdropped addresses)"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bao-airdrop
          path: |
            airdrop_list.json
            airdrop_announcement.txt
            airdrop_transfers.json
            airdrop_history.json
