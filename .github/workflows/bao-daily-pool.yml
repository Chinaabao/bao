name: Bao Daily Pool Announcement

on:
  # 每天 12:00 UTC = 晚上 20:00 (UTC+8) 发送奖池累积公告（GitHub Actions 使用 UTC）
  schedule:
    - cron: "0 12 * * *"
  # 手动触发，便于测试是否正常发电报
  workflow_dispatch:

jobs:
  daily-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily pool & publish to Telegram
        env:
          BAO_POOL_ADDRESS: ${{ secrets.BAO_POOL_ADDRESS }}
          BAO_TG_BOT_TOKEN: ${{ secrets.BAO_TG_BOT_TOKEN }}
          BAO_TG_CHAT_ID: ${{ secrets.BAO_TG_CHAT_ID }}
        run: python3 lottery/scripts/bao_daily_pool.py

      - name: Upload announcement artifact
        uses: actions/upload-artifact@v4
        with:
          name: bao-daily-pool-announcement
          path: daily_pool_announcement.txt
